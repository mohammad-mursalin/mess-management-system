<div class="counts-row">
    <div class="count-card">
        <span class="count-label">Breakfast</span>
        <span class="count-value">{{ counts.breakfast_count }}</span>
    </div>
    <div class="count-card">
        <span class="count-label">Lunch</span>
        <span class="count-value">{{ counts.lunch_count }}</span>
    </div>
    <div class="count-card">
        <span class="count-label">Dinner</span>
        <span class="count-value">{{ counts.dinner_count }}</span>
    </div>
</div>
